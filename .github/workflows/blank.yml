
name: Construire APK Wells Pad

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extraire le projet Android
        run: |
          unzip -o Wells-Pad-Android-GitHub.zip -d .
          test -f wells-pad-android/app/build.gradle

      - name: Compiler Wells Pad
        working-directory: wells-pad-android
        run: gradle assembleDebug

      - name: Publier le fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: Wells-Pad-APK
          path: wells-pad-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
